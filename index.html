<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Boba Beat Maker - Interactive Audio</title>
    <style>
        body {
            background-color: #f7f3ee;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            display: flex;
            gap: 60px;
            align-items: center;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        /* 奶茶杯 UI */
        .cup-wrapper {
            position: relative;
            width: 160px;
            height: 240px;
        }
        .cup {
            width: 100%;
            height: 100%;
            border: 6px solid #e0dcd5;
            border-top: none;
            border-radius: 0 0 40px 40px;
            position: relative;
            overflow: hidden;
            background: rgba(255,255,255,0.5);
        }
        /* 液体基底 */
        .liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%; /* 初始高度为0 */
            transition: height 0.5s ease, background-color 0.5s ease;
        }
        .liquid.tea { background-color: #d6985a; height: 80%; }
        .liquid.milk { background-color: #fdf6e3; height: 80%; }
        
        /* 小料容器 */
        .toppings-container {
            position: absolute;
            bottom: 10px;
            width: 100%;
            height: 80px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-content: flex-end;
            padding: 0 10px;
            box-sizing: border-box;
            gap: 5px;
        }
        .boba-item {
            width: 16px; height: 16px; border-radius: 50%; background: #222;
        }
        .redbean-item {
            width: 14px; height: 10px; border-radius: 40%; background: #8a3324;
        }
        .coconut-item {
            width: 12px; height: 12px; background: #fffdf5; border: 1px solid #ddd;
        }

        /* 控制面板 */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 250px;
        }
        h1 { margin: 0; font-size: 1.8rem; letter-spacing: -1px; }
        p { margin: 0; font-size: 0.85rem; color: #777; }
        
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #f0ece6;
            color: #333;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }
        button:hover { background: #e2ddd6; transform: translateY(-2px); }
        button.active { background: #d9534f; color: white; }
        
        #startBtn {
            background: #111; color: white; text-align: center; justify-content: center; margin-bottom: 10px;
        }
        #startBtn:hover { background: #333; }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%; background: #ccc; display: inline-block; margin-left: 10px;
        }
        .playing .status-dot { background: #4caf50; box-shadow: 0 0 8px #4caf50; animation: pulse 1s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 视觉区：奶茶杯 -->
        <div class="cup-wrapper">
            <div class="cup">
                <div class="liquid" id="liquidView"></div>
                <div class="toppings-container" id="toppingsView"></div>
            </div>
        </div>

        <!-- 交互区：控制面板 -->
        <div class="controls">
            <div>
                <h1>Boba Beat Maker</h1>
                <p>Add ingredients to mix your audio track.</p>
            </div>

            <button id="startBtn">1. Power On Audio Engine <span class="status-dot"></span></button>

            <div class="btn-group" style="pointer-events: none; opacity: 0.5;" id="ingredientsPanel">
                <p>Select Base (Chords):</p>
                <button class="base-btn" data-base="tea">🍵 Black Tea (Classic Pad)</button>
                <button class="base-btn" data-base="milk">🥛 Milk (Soft Synth)</button>
                
                <p style="margin-top:10px;">Add Toppings (Rhythm):</p>
                <button class="topping-btn" data-topping="boba">⚫ Boba (Melody Pluck)</button>
                <button class="topping-btn" data-topping="redbean">🔴 Red Bean (Kick Drum)</button>
                <button class="topping-btn" data-topping="coconut">⬜ Coconut Jelly (Hi-hat)</button>
                <button id="resetBtn" style="margin-top: 15px; text-align:center; justify-content:center; background:#ddd;">🗑️ Empty Cup</button>
            </div>
        </div>
    </div>

    <script>
        // 状态管理
        let audioCtx = null;
        let isPlaying = false;
        let currentStep = 0;
        let nextNoteTime = 0;
        let timerID = null;

        // 用户当前的饮品配方
        let recipe = {
            base: null, // 'tea' 或 'milk'
            toppings: new Set() // 存放 'boba', 'redbean', 'coconut'
        };

        // DOM 元素
        const startBtn = document.getElementById('startBtn');
        const ingredientsPanel = document.getElementById('ingredientsPanel');
        const liquidView = document.getElementById('liquidView');
        const toppingsView = document.getElementById('toppingsView');

        // 音符频率数据 (C大调五声音阶)
        const notes = {
            C4: 261.63, E4: 329.63, G4: 392.00, A4: 440.00, C5: 523.25
        };
        // 珍珠旋律 pattern (8步)
        const bobaMelody = [notes.C5, null, notes.G4, notes.A4, null, notes.E4, notes.C5, null];

        // 核心发声函数
        function playSound(type, time) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'tea' || type === 'milk') {
                // 基底：在每个小节开头（step 0）播放长和弦音
                if (currentStep === 0) {
                    osc.type = type === 'tea' ? 'sine' : 'triangle';
                    osc.frequency.value = type === 'tea' ? notes.C4 : notes.E4;
                    gain.gain.setValueAtTime(0, time);
                    gain.gain.linearRampToValueAtTime(0.15, time + 0.5);
                    gain.gain.exponentialRampToValueAtTime(0.01, time + 2.0);
                    osc.start(time);
                    osc.stop(time + 2.0);
                }
            } 
            else if (type === 'boba') {
                // 珍珠：轻快的旋律音
                let freq = bobaMelody[currentStep];
                if (freq) {
                    osc.type = 'square';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.1);
                    osc.start(time);
                    osc.stop(time + 0.1);
                }
            }
            else if (type === 'redbean') {
                // 红豆：底鼓 (Kick Drum) - 在 0, 4 拍出现
                if (currentStep === 0 || currentStep === 4) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, time);
                    osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.1); // 音高快速下降产生打击感
                    gain.gain.setValueAtTime(0.4, time);
                    gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
                    osc.start(time);
                    osc.stop(time + 0.1);
                }
            }
            else if (type === 'coconut') {
                // 椰果：连续的短促高频打击乐 (Hi-hat) - 在 2, 4, 6 拍出现
                if (currentStep % 2 !== 0) {
                    osc.type = 'square';
                    osc.frequency.value = 800;
                    gain.gain.setValueAtTime(0.05, time);
                    gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
                    osc.start(time);
                    osc.stop(time + 0.05);
                }
            }
        }

        // 调度器 (Web Audio API 精确计时)
        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + 0.1) {
                // 调度当前步的声音
                if (recipe.base) playSound(recipe.base, nextNoteTime);
                recipe.toppings.forEach(topping => playSound(topping, nextNoteTime));
                
                // 推进到下一步
                nextNoteTime += 0.25; // 速度 (Tempo): 0.25秒一拍
                currentStep = (currentStep + 1) % 8; // 8拍一个循环
            }
            timerID = setTimeout(scheduler, 25.0);
        }

        // 启动引擎
        startBtn.addEventListener('click', () => {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (!isPlaying) {
                isPlaying = true;
                startBtn.classList.add('playing');
                startBtn.innerHTML = `Audio Engine Running <span class="status-dot"></span>`;
                ingredientsPanel.style.opacity = "1";
                ingredientsPanel.style.pointerEvents = "auto";
                
                nextNoteTime = audioCtx.currentTime + 0.1;
                currentStep = 0;
                scheduler();
            }
        });

        // 交互：选择基底
        document.querySelectorAll('.base-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.base-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                recipe.base = btn.dataset.base;
                
                // 视觉反馈
                liquidView.className = `liquid ${recipe.base}`;
            });
        });

        // 交互：添加小料
        document.querySelectorAll('.topping-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const topping = btn.dataset.topping;
                
                // 切换逻辑 (Toggle)
                if (recipe.toppings.has(topping)) {
                    recipe.toppings.delete(topping);
                    btn.classList.remove('active');
                    removeToppingVisuals(topping);
                } else {
                    recipe.toppings.add(topping);
                    btn.classList.add('active');
                    addToppingVisuals(topping);
                }
            });
        });

        // 交互：清空杯子
        document.getElementById('resetBtn').addEventListener('click', () => {
            recipe.base = null;
            recipe.toppings.clear();
            document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
            liquidView.className = 'liquid';
            toppingsView.innerHTML = '';
        });

        // 视觉助手：生成小料UI
        function addToppingVisuals(type) {
            // 生成5-8个小颗粒
            let count = type === 'boba' ? 8 : (type === 'redbean' ? 12 : 6);
            for(let i=0; i<count; i++) {
                let item = document.createElement('div');
                item.className = `${type}-item item-element`;
                item.dataset.type = type;
                toppingsView.appendChild(item);
            }
        }

        function removeToppingVisuals(type) {
            const items = toppingsView.querySelectorAll(`.item-element[data-type="${type}"]`);
            items.forEach(item => item.remove());
        }
    </script>
</body>
</html>
