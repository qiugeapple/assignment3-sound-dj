<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S/M - Cyber Turntable</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #e6e3e0; /* 经典高级米灰色背景 */
            color: #111;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 顶部导航 */
        .header {
            position: absolute;
            top: 30px;
            width: 85%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #777;
        }

        /* 主内容卡片：采用更宽敞的网格布局 */
        .main-wrapper {
            display: grid;
            grid-template-columns: 320px 380px;
            gap: 60px;
            align-items: center;
            padding: 50px 60px;
            background: #ffffff;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04);
            border-radius: 8px;
            max-width: 900px;
        }

        /* 左侧：黑胶唱片区域（完美内嵌，不再溢出） */
        .vinyl-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .vinyl-container {
            position: relative;
            width: 280px;
            height: 280px;
        }

        .turntable {
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIzMDAiIGhlaWdodD0iMzAwIiB2aWV3Qm94PSIwIDAgMzAwIDMwMCI+CiAgPGNpcmNsZSBjeD0iMTUwIiBjeT0iMTUwIiByPSIxNDgiIGZpbGw9IiMwMDAiLz4KICA8Y2lyY2xlIGNjeD0iMTUwIiBjeT0iMTUwIiByPSIxMjAiIGZpbGw9IiMyMjIiLz4KICA8Y2lyY2xlIGNjeD0iMTUwIiBjeT0iMTUwIiByPSI5MCIgZmlsbD0iIzQ0NCIvPgogIDxjaXJjbGUgY3g9IjE1MCIgY3k9IjE1MCIgcj0iNjAiIGZpbGw9IiM2NjYiLz4KICA8Y2lyY2xlIGNjeD0iMTUwIiBjeT0iMTUwIiByPSIzMCIgZmlsbD0iIzhhOGE4YSIvPgogIDxjaXJjbGUgY3g9IjE1MCIgY3k9IjE1MCIgcj0iMTUiIGZpbGw9IiNmZmYiLz4KPC9zdmc+');
            background-size: cover;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .spinning {
            animation: spin 3s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 唱片上的红色参考线与指示点 */
        .vinyl-guide-line {
            position: absolute;
            top: 0;
            left: 140px;
            width: 1px;
            height: 100%;
            background: rgba(220, 53, 69, 0.4);
            pointer-events: none;
        }
        
        .now-playing-dot {
            position: absolute;
            top: 50%;
            left: 140px;
            width: 8px;
            height: 8px;
            background: #dc3545;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 6px #dc3545;
            display: none;
        }

        .time-display {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #888;
            letter-spacing: 1px;
        }

        /* 右侧：信息与交互控件 */
        .info-section {
            display: flex;
            flex-direction: column;
        }

        .album-title {
            font-size: 3rem;
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: -1.5px;
            margin: 0 0 8px 0;
            color: #111;
        }

        .artist-name {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* 极简按钮 */
        .btn-start {
            background-color: #111;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            text-transform: uppercase;
            width: fit-content;
            margin-bottom: 25px;
            border-radius: 2px;
        }

        .btn-start:hover {
            background-color: #333;
        }

        .btn-start:active {
            transform: scale(0.98);
        }

        /* 控制面板区域 */
        .controls-wrapper {
            border-top: 1px solid #eee;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 3px;
            background: #e0e0e0;
            outline: none;
            border-radius: 2px;
        }
        
        #speedSlider { accent-color: #007bff; }
        #pitchSlider { accent-color: #dc3545; }

        .status {
            font-size: 0.7rem;
            color: #dc3545;
            margin-top: 15px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* 底部版权说明 */
        .footer {
            position: absolute;
            bottom: 30px;
            text-align: center;
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>S/M</span>
        <span>ARTISTS &nbsp;/&nbsp; MIXTAPES &nbsp;/&nbsp; AWARDS</span>
    </div>

    <div class="main-wrapper">
        <!-- 左侧黑胶区块 -->
        <div class="vinyl-section">
            <div class="vinyl-container">
                <div class="turntable" id="vinyl"></div>
                <div class="vinyl-guide-line"></div>
                <div class="now-playing-dot" id="playDot"></div>
            </div>
            <div class="time-display">
                <span id="currentTimeDisplay">0:00</span> / <span id="totalTimeDisplay">4:08</span>
            </div>
        </div>

        <!-- 右侧信息与交互区块 -->
        <div class="info-section">
            <h1 class="album-title">CYBER<br>TURNTABLE</h1>
            <p class="artist-name">Interactive Audio Lab</p>

            <button class="btn-start" id="startBtn">💿 Power On</button>

            <div class="controls-wrapper" id="controlsArea" style="opacity: 0.4; pointer-events: none; transition: opacity 0.3s;">
                <div class="control-group">
                    <label for="speedSlider">
                        <span>Tempo</span>
                        <span id="speedVal">1.0x</span>
                    </label>
                    <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0">
                </div>

                <div class="control-group">
                    <label for="pitchSlider">
                        <span>Pitch Shift</span>
                        <span><span id="pitchVal">440</span> Hz</span>
                    </label>
                    <input type="range" id="pitchSlider" min="220" max="880" step="10" value="440">
                </div>
            </div>

            <div class="status" id="statusText">SYSTEM READY</div>
        </div>
    </div>

    <div class="footer">
        BEST SOUNDS &bull; 2026
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let timer = null;
        
        const startBtn = document.getElementById('startBtn');
        const vinyl = document.getElementById('vinyl');
        const playDot = document.getElementById('playDot');
        const speedSlider = document.getElementById('speedSlider');
        const pitchSlider = document.getElementById('pitchSlider');
        const speedVal = document.getElementById('speedVal');
        const pitchVal = document.getElementById('pitchVal');
        const statusText = document.getElementById('statusText');
        const controlsArea = document.getElementById('controlsArea');
        const currentTimeDisplay = document.getElementById('currentTimeDisplay');

        const melody = [261.63, 293.66, 329.63, 392.00, 440.00, 392.00, 329.63, 293.66];
        let noteIndex = 0;
        let currentSpeed = 1.0;
        let currentPitch = 440;
        let startTime = 0;

        function playTone(freq) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }

        function updateTimeDisplay() {
            if (!isPlaying) return;
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            currentTimeDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            if (elapsed >= 248) {
                startTime = Date.now();
            }
        }

        function startMusicLoop() {
            if (timer) clearInterval(timer);
            let interval = 500 / currentSpeed;

            timer = setInterval(() => {
                if (!isPlaying) {
                    clearInterval(timer);
                    return;
                }
                let baseFreq = melody[noteIndex];
                let adjustedFreq = baseFreq * (currentPitch / 440);
                
                playTone(adjustedFreq);
                updateTimeDisplay();
                
                noteIndex = (noteIndex + 1) % melody.length;
            }, interval);
        }

        startBtn.addEventListener('click', () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (!isPlaying) {
                isPlaying = true;
                startTime = Date.now();
                vinyl.classList.add('spinning');
                playDot.style.display = 'block';
                startBtn.innerText = "💿 Power Off";
                statusText.innerText = "PLAYING ACTIVE";
                controlsArea.style.opacity = "1";
                controlsArea.style.pointerEvents = "auto";
                startMusicLoop();
            } else {
                isPlaying = false;
                vinyl.classList.remove('spinning');
                playDot.style.display = 'none';
                startBtn.innerText = "💿 Power On";
                statusText.innerText = "SYSTEM PAUSED";
                controlsArea.style.opacity = "0.4";
                controlsArea.style.pointerEvents = "none";
                clearInterval(timer);
                currentTimeDisplay.innerText = "0:00";
            }
        });

        speedSlider.addEventListener('input', (e) => {
            currentSpeed = parseFloat(e.target.value);
            speedVal.innerText = `${currentSpeed.toFixed(1)}x`;
            vinyl.style.animationDuration = (3 / currentSpeed) + 's';
            if (isPlaying) startMusicLoop();
        });

        pitchSlider.addEventListener('input', (e) => {
            currentPitch = parseInt(e.target.value);
            pitchVal.innerText = currentPitch;
        });
    </script>
</body>
</html>
